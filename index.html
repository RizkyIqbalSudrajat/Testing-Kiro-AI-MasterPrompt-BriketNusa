  <body class="bg-[#FAFAF7] dark:bg-[#0C0A09] text-stone-900 dark:text-stone-100 antialiased selection:bg-[#F97316] selection:text-white transition-colors duration-300">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('briketnusa_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
